module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

# Params
params:

  # Hugolify admin
  admin:
    collections:
      jobs:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: briefcase
          iconoir: suitcase
          material_icons: work
          material_symbols: work
          lucide: briefcase-business
        path: "{{year}}/{{slug}}"
        sortable: '[date, title]'

  # Image
  jobs:
    thumbnail:
      desktop: '416x179'
      desktop_large: '636x273'
      mobile: '300x129'
      scrollsnap: '240x103'
      sizes: 100vw, 50vw, 33vw
    image:
      desktop: '420x'
      sizes: 100vw, 50vw, 33vw

# Permalinks
permalinks:
  page:
    jobs: /jobs/:slug/
